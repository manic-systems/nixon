[package]
name = "nixon-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "C bindings for the Nixon Nix parser"
license = "EUPL-1.2"
repository = "https://github.com/manic-systems/nixon"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
nixon = { path = ".." }

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
correctness = "deny"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"
