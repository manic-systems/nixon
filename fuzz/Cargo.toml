[package]
name    = "nixon-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nixon         = { path = "../crates/nixon" }

[[bin]]
bench = false
doc   = false
name  = "parse"
path  = "fuzz_targets/parse.rs"
test  = false

[workspace]
members = [ "." ]

[profile.release]
debug = 1
